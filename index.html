<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oráculo Vitoriano</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="vintage-overlay" aria-hidden="true"></div>

  <div class="app-container">
    <header class="victorian-header">
      <p class="eyebrow">Sociedade Hermética</p>
      <h1 class="main-title">Oráculo Vitoriano</h1>
      <div class="divider-ornament" aria-hidden="true"></div>
    </header>

    <section class="table-panel" aria-label="Controles da mesa">
      <div class="table-top-row">
        <div>
          <h2 class="section-title">Mesa de Leituras</h2>
          <p class="section-subtitle">Configure de 1 a 5 jogadores, cada um com sua própria leitura.</p>
        </div>

        <div class="table-actions">
          <button id="btnAddPlayer" class="btn-primary" type="button">Adicionar Jogador</button>
          <button id="btnRemovePlayer" class="btn-secondary" type="button">Remover Último</button>
          <button id="btnClearTable" class="btn-secondary" type="button">Limpar Mesa</button>
        </div>
      </div>

      <div class="table-feedback" id="tableFeedback" aria-live="polite"></div>
    </section>

    <main id="playersBoard" class="players-board" aria-label="Leituras dos jogadores"></main>

    <footer class="victorian-footer">
      <p>Gabinete de Leituras &middot; MDCCCL</p>
    </footer>
  </div>

  <div id="manualModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="manualModalTitle">
      <h2 id="manualModalTitle">Inserir Lâmina</h2>
      <p>Insira um número de <strong>1 a 156</strong>.<br />1–78 = normal, 79–156 = invertida.</p>

      <input type="number" id="manualCardId" min="1" max="156" value="1" />

      <div class="modal-actions">
        <button id="btnConfirmManual" class="btn-primary" type="button">Confirmar</button>
        <button id="btnCancelManual" class="btn-secondary" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
